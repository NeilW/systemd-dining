[Distribution]
Distribution=ubuntu
Release=resolute
Components=mail,restricted,universe

[Output]
Format=tar
CompressOutput=xz
ImageId=philosophers

[Validation]
Checksum=yes

[Host]
ToolsTree=default

[Content]
WithNetwork=no
Packages=libpam-systemd
         systemd
         systemd-sysv
         udev
         dbus
         dma
         mailutils
         finger
         inotify-tools
         libpam-systemd
         iproute2
         locales
         neovim
         man-db
RemoveFiles=/etc/update-motd.d/50-motd-news,/etc/legal
